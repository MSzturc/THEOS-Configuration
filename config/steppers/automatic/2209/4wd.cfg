[include 2wd.cfg]

[tmc2209 stepper_x1]
run_current: ${constants.xy_run_current}
motor: ${constants.xy_motor}
voltage: ${constants.xy_voltage}
tuning_goal: ${constants.xy_tuning_goal:balanced}
pwm_freq_target: ${constants.xy_pwm_freq_target:None}
chopper_freq_target: ${constants.xy_chopper_freq_target:None}
extra_hysteresis: ${constants.xy_extra_hysteresis:0}
coolstep_threshold: ${constants.xy_coolstep_threshold:None}
stealthchop_threshold: ${constants.xy_stealthchop_threshold:None}
driver_TBL: ${constants.xy_driver_tbl:None}
driver_TOFF: ${constants.xy_driver_toff:None}
driver_HEND: ${constants.xy_driver_hend:None}
driver_HSTRT: ${constants.xy_driver_hstrt:None}
interpolate: ${constants.xy_interpolate:true}

[tmc2209 stepper_y1]
run_current: ${constants.xy_run_current}
motor: ${constants.xy_motor}
voltage: ${constants.xy_voltage}
tuning_goal: ${constants.xy_tuning_goal:balanced}
pwm_freq_target: ${constants.xy_pwm_freq_target:None}
chopper_freq_target: ${constants.xy_chopper_freq_target:None}
extra_hysteresis: ${constants.xy_extra_hysteresis:0}
coolstep_threshold: ${constants.xy_coolstep_threshold:None}
stealthchop_threshold: ${constants.xy_stealthchop_threshold:None}
driver_TBL: ${constants.xy_driver_tbl:None}
driver_TOFF: ${constants.xy_driver_toff:None}
driver_HEND: ${constants.xy_driver_hend:None}
driver_HSTRT: ${constants.xy_driver_hstrt:None}
interpolate: ${constants.xy_interpolate:true}
